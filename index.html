<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>a billion dollars</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Scroll from one dollar to a trillion and feel how big big numbers really are.">
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='9' fill='%234DE4B2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<canvas id="field" aria-hidden="true"></canvas>
<div class="scrim scrim-top" aria-hidden="true"></div>
<div class="scrim scrim-bottom" aria-hidden="true"></div>

<header class="top">
  <a class="brand" href="#top" id="brand">a billion dollars</a>
  <nav class="units" id="units" aria-label="Choose a unit"></nav>
</header>

<div class="hud" aria-live="polite">
  <div class="lead" id="lead">How big is a billion dollars?</div>
  <div class="word" id="word">one</div>
  <div class="number" id="number">$1</div>
  <div class="live" id="live"></div>
</div>

<p class="caption" id="caption"></p>

<div class="hint" id="hint" aria-hidden="true"><span>scroll</span><i></i></div>

<nav class="marks" id="marks" aria-label="Jump to a milestone"></nav>

<div class="outro" id="outro">
  <div class="outro-inner">
    <div class="outro-title">That was a trillion.</div>
    <div class="outro-sub">Now feel it in something else.</div>
    <div class="outro-units" id="outro-units"></div>
    <button class="outro-top" id="outro-top" type="button">Back to one</button>
  </div>
</div>

<div class="track" id="track"></div>

<script src="app.js"></script>
</body>
</html>
